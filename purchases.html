<!DOCTYPE html>
<html lang="en">
<head>
    <title>Закупки</title>
    <link rel="website icon" href="logoWebIcon.svg" type="svg">
    <link rel="stylesheet" href="Styles.css" type="text/css">
    <link rel="stylesheet" href="form.css" title="text/css">
    <link rel="stylesheet" href="modal.css" type="text/css">

    <script src="scriptsTest.js"></script>
    <script src="modal.js"></script>
</head>
<body>
    <header>
        <div class="HDv">
            <img src="logo.svg" width="150" height="120">
            <button class="HBtn"><a href="sales.html" class="HA">ПРОДАЖИ</a></button>
            <button class="HBtn"><a href="purchases.html">ЗАКУПКИ</a></button>
            <button class="HBtn"><a href="inventory.html">СКЛАД</a></button>
            <button class="AddBtn" ID = "show-modal" style="position: absolute;">ДОБАВИТЬ</button>
        </div>
    </header>
    <main>
        <script>
            const ids = {
                DateofCreate: 'DateofCreate',
                IDSales: 'IDBuy',
                Client: 'supplier',
                Manager: 'manager',
                Sum: 'sum',
                DateofDispatch: 'dateOfReceipt',
                Status: 'Status'
            };

            // создаём модальное окно
            const modal = new ItcModal({
            });
            modal.setBody("<form class = 'form-container'><div><label for = 'DateofCreate'>Дата создания</label><input type = 'date' name = 'DateofCreate' ID = 'DateofCreate' width = '100' ></div><div><label for = 'IDBuy'>Номер закупки</label><input type = 'text' ID = 'IDBuy' name = 'IDBuy' width = '40'  ><div><label for = 'supplier'>Поставщик</label><input type = 'text' ID = 'supplier' name = 'supplier' width = '40'  ></div><div><label for = 'manager'>Ответственный менеджер</label><input type = 'text' ID = 'manager' name = 'manager' widht= '40'  ></div><div><label for = 'sum'>Сумма закупки</label><input type = 'number' min = '1' ID = 'sum' name = 'sum' width = '40'  ></div><div><label for = 'dateOfReceipt'>Дата получения</label><input type = 'date' ID = 'dateOfReceipt' name = 'dateOfReceipt' width = '100'  ></div><div class='radio-group'><input name = 'Status' type = 'radio' value = 'Выполнено' ID = 'StatusT' checked><label for = 'StatusT'><span></span>Выполнено</label><input name = 'Status' type = 'radio' value = 'В процессе' ID = 'StatusF'><label for = 'StatusF'><span></span>В процессе</label></div><div><button onclick = 'sales(ids)' type = 'submit'>Отправить</button></div></form>");
            // при клике по кнопке #show-modal
            document.querySelector('#show-modal').addEventListener('click', () => {
              // откроем модальное окно
              modal.show();
            });
        </script>
        <table id="purchasesTable">
            <thead>
                <tr>
                    <th>Дата создания</th>
                    <th>Номер закупки</th>
                    <th>Поставщик</th>
                    <th>Ответственный менеджер</th>
                    <th>Сумма закупки</th>
                    <th>Дата получения</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody>
                <!-- Данные будут добавлены здесь через JavaScript -->
            </tbody>
        </table>
    </main>
    <script src="purchases.js"></script>
</body>
</html>
